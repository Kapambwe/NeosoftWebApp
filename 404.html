<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      (function() {
        var hostname = window.location.hostname;
        var isGitHubPages = hostname === 'kapambwe.github.io' || hostname.includes('github.io');
        var targetBase = isGitHubPages ? '/NeosoftWebApp/' : '/';
        var redirectTo = targetBase + 'index.html' + location.search + location.hash;
        var path = location.pathname.replace('/NeosoftWebApp', '');
        if (path && path !== '/index.html') {
          redirectTo += '?path=' + encodeURIComponent(path);
        }
        window.location.replace(redirectTo);
      })();
    </script>
</head>
<body>
</body>
</html>
