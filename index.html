    <!-- Dynamic base path - works for local, GitHub Pages, and Cloudflare Pages -->
    <base href="/NeosoftWebApp/" id="app-base" />
    <link href="_framework/dotnet.j9l9dc4v87.js" rel="preload" as="script" fetchpriority="high" crossorigin="anonymous" integrity="sha256-GU9SLM9/eU7IWPp4Lw4ELzCRua/BIOv37yuqpT633Cw=" />
    <script>
        (function () {
            var base = document.getElementById('app-base');
            var hostname = window.location.hostname;
            var currentBase = base.getAttribute('href');

            if (currentBase === '/') {
                if (hostname === 'kapambwe.github.io' || hostname.includes('github.io')) {
                    base.setAttribute('href', '/NeosoftWebApp/');
                    console.log('GitHub Pages detected - using base: /NeosoftWebApp/');
                } else {
                    base.setAttribute('href', '/');
                    console.log('Local/Custom domain detected - using base: /');
                }
            } else {
                console.log('Base path pre-configured: ' + currentBase);
            }
        })();
    </script>

    <script type="text/javascript">
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location));
    </script>
